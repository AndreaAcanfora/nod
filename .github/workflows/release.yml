name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set: releases must be signed with the release key"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.p12
          storeType=pkcs12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=nod
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
      - run: flutter build apk --release --split-per-abi && flutter build apk --release
      - name: Collect APKs
        run: |
          v="${GITHUB_REF_NAME}"
          cd build/app/outputs/flutter-apk
          cp app-release.apk "nod-$v.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do cp "app-$abi-release.apk" "nod-$v-$abi.apk"; done
          sha256sum nod-*.apk > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "nod $GITHUB_REF_NAME" --notes-file "fastlane/metadata/android/en-US/changelogs/1.txt" build/app/outputs/flutter-apk/nod-*.apk build/app/outputs/flutter-apk/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
